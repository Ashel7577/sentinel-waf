<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel WAF</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --dim:#8b93a7; --red:#ef5b5b; --amber:#e8a93b; --green:#3fb27f; --blue:#5b8def; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  .meta { color:var(--dim); font-size:13px; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .tile .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .tile .v { font-size:24px; font-variant-numeric:tabular-nums; margin-top:4px; }
  .grid { display:grid; grid-template-columns: 1fr 2fr; gap:16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; }
  h2 { font-size:13px; text-transform:uppercase; color:var(--dim); margin:0 0 10px; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .bar { height:8px; background:var(--blue); border-radius:4px; }
  .act { font-weight:600; }
  .blocked { color:var(--red); } .flagged { color:var(--amber); } .rate-limited { color:var(--blue); }
  code { font-family: ui-monospace, Consolas, monospace; font-size:12px; word-break:break-all; color:#c9d1e3; }
</style>
</head>
<body>
<header><h1>Sentinel WAF</h1><span class="meta" id="meta">connecting…</span></header>
<main>
  <div class="tiles">
    <div class="tile"><div class="k">Requests</div><div class="v" id="req">–</div></div>
    <div class="tile"><div class="k">Blocked</div><div class="v" id="blk">–</div></div>
    <div class="tile"><div class="k">Flagged</div><div class="v" id="flg">–</div></div>
    <div class="tile"><div class="k">Rate limited</div><div class="v" id="rl">–</div></div>
    <div class="tile"><div class="k">Avg inspect</div><div class="v" id="avg">–</div></div>
    <div class="tile"><div class="k">p99 inspect ≤</div><div class="v" id="p99">–</div></div>
  </div>
  <div class="grid">
    <section><h2>Attack categories</h2><table id="cats"></table></section>
    <section><h2>Recent events</h2>
      <table><thead><tr><th>Time</th><th>Action</th><th>Score</th><th>Request</th><th>Reason</th></tr></thead><tbody id="ev"></tbody></table>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const us = v => v >= 1000 ? (v/1000).toFixed(2)+' ms' : v.toFixed(0)+' µs';
async function tick() {
  try {
    const d = await (await fetch('/stats')).json(); const s = d.stats;
    $('meta').textContent = `mode: ${d.mode} · threshold ${d.threshold} · paranoia ${d.paranoia} · ${d.rules} rules · upstream ${d.upstream} · up ${s.uptime_seconds}s`;
    $('req').textContent = s.requests; $('blk').textContent = s.blocked; $('flg').textContent = s.flagged;
    $('rl').textContent = s.rate_limited; $('avg').textContent = us(s.avg_inspect_us); $('p99').textContent = us(s.p99_inspect_us_le);
    const cats = Object.entries(s.categories).sort((a,b)=>b[1]-a[1]); const max = Math.max(1, ...cats.map(c=>c[1]));
    $('cats').innerHTML = cats.map(([c,n]) => `<tr><td>${esc(c)}</td><td style="width:60%"><div class="bar" style="width:${100*n/max}%"></div></td><td>${n}</td></tr>`).join('') || '<tr><td class="meta">no findings yet</td></tr>';
    $('ev').innerHTML = (s.recent||[]).slice(0,40).map(e => `<tr><td>${new Date(e.time).toLocaleTimeString()}</td><td class="act ${esc(e.action)}">${esc(e.action)}</td><td>${e.score}</td><td><code>${esc(e.method)} ${esc(e.path)}</code></td><td>${esc(e.message)}</td></tr>`).join('');
  } catch (e) { $('meta').textContent = 'disconnected'; }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
