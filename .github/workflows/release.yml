name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # keyless cosign signing + provenance (OIDC)
      attestations: write  # SLSA build provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sign checksums (cosign keyless)
        run: |
          cosign sign-blob --yes dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip"
